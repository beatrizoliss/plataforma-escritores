<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Perfil do Usuário</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,800,900');
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, #65422A, #2B1511, #E5D3B3);
            background-size: 600% 600%;
            animation: gradientAnimation 15s ease infinite;
        }
        .profile-container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 600px;
            text-align: center;
            position: relative;
        }
        .profile-card {
            background-color: rgba(101, 66, 42, 0.9);
            color: #FFF6EA;
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }
        .profile-card h4 {
            margin-bottom: 30px;
            color: #E5D3B3;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        .profile-info p {
            margin: 30px 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .profile-info p i {
            margin-right: 15px;
            font-size: 24px;
            color: #E5D3B3;
        }
        .btn {
            border-radius: 25px;
            height: 54px;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 0 35px;
            margin-top: 30px;
            background-color: #2B1511;
            color: #FFF6EA;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            margin-right: 10px;
            width: 150px; /* Ajuste o tamanho do botão */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn:hover {
            background-color: #3E221B;
            color: #E5D3B3;
            border-color: #E5D3B3;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .pattern {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: url('https://www.transparenttextures.com/patterns/double-lined.png');
            opacity: 0.1;
            pointer-events: none;
        }
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="pattern"></div>
        <div class="profile-card">
            <h4>Perfil do Usuário</h4>
            <div class="profile-info">
                <p><i class="uil uil-user"></i><strong>Nome:</strong> João da Silva</p>
                <p><i class="uil uil-phone"></i><strong>Telefone:</strong> (11) 98765-4321</p>
                <p><i class="uil uil-at"></i><strong>Email:</strong> joao@example.com</p>
            </div>
            <a href="#" class="btn">Sair</a>
            <a href="#" class="btn">Voltar</a>
        </div>
    </div>
</body>
</html>
